# Filter rules for the family calendar.
# After committing any change here, the workflow re-runs automatically.
# The preview page updates within ~2 minutes; Google Calendar within a few hours.
#
# GRADE RULES ARE AUTOMATIC. Just keep the graduation years below correct.
# The script calculates each kid's current grade from their graduation year
# and the date of each event -- no annual edits required.

output_name: "Nueva Family Filtered"
output_filename: "family.ics"
output_dir: "output"
timezone: "America/Los_Angeles"

# ---------------------------------------------------------------------------
# STUDENTS
# The only thing you ever need to update. Graduation years drive all
# grade-based filtering automatically.
# ---------------------------------------------------------------------------
students:
  - name: maia
    graduation_year: 2027   # Currently 11th grade, becoming 12th in Aug 2026
  - name: zander
    graduation_year: 2033   # Currently 5th grade, becoming 6th in Aug 2026

# Source feeds. URLs live in GitHub Secrets, not here.
feeds:
  - name: whole_school
    url_env: FEED_WHOLE_SCHOOL
  - name: middle_school
    url_env: FEED_MIDDLE_SCHOOL
  - name: upper_school
    url_env: FEED_UPPER_SCHOOL
  - name: maia_games
    url_env: FEED_MAIA_GAMES
  - name: zander_games
    url_env: FEED_ZANDER_GAMES

always_include_feeds:
  - maia_games
  - zander_games

feed_defaults:
  whole_school: include
  middle_school: exclude
  upper_school: exclude

# ---------------------------------------------------------------------------
# STATIC TITLE EXCLUDES
# Grade 5-12 exclusions are handled automatically by the script.
# This list only needs below-grade-5 levels and wrong class years.
# ---------------------------------------------------------------------------
title_excludes:
  - "kindergarten"
  - "1st grade"
  - "2nd grade"
  - "3rd grade"
  - "4th grade"
  - "lower school"
  - "class of 2024"
  - "class of 2025"
  - "class of 2026"
  - "class of 2028"
  - "class of 2029"
  - "class of 2030"
  - "class of 2031"
  - "class of 2032"
  - "class of 2034"
  - "class of 2035"
  - "class of 2036"

# Rescue keywords: a title-excluded event that also matches any of these
# is rescued back into normal processing.
title_rescue_keywords:
  - "maia"
  - "zander"
  - "all-school"
  - "all school"
  - "lower & middle"
  - "ls & ms"
  - "ls/ms"
  - "no school"
  - "no classes"
  - "class of 2027"
  - "class of 2033"

# ---------------------------------------------------------------------------
# INCLUDE KEYWORDS (full text: title + description + location + categories)
# Grade keywords are NOT needed here -- handled dynamically.
# ---------------------------------------------------------------------------
include_keywords:
  - "maia"
  - "zander"
  - "class of 2027"
  - "class of 2033"
  - "steel drum"
  - "steel drums"
  - "parent"
  - "parents"
  - "family"
  - "all-school"
  - "all school"
  - "community"
  - "holiday"
  - "no school"
  - "no classes"
  - "school closed"
  - "early dismissal"
  - "conferences"
  - "back to school"
  - "back-to-school"
  - "open house"
  - "npa"

# ---------------------------------------------------------------------------
# EXCLUDE KEYWORDS (full text)
# ---------------------------------------------------------------------------
exclude_keywords:
  - "graduation"

# ---------------------------------------------------------------------------
# ALWAYS EXCLUDE -- highest priority, no rescue possible.
# ---------------------------------------------------------------------------
always_exclude_keywords:
  - "npa retreat"
  - "npa half day retreat"
  - "npa board"
  - "npa board meeting"
  - "athletics commitment ceremony"
  - "family garden workday"
  - "sustaining joy and wellness in the black"
  - "financial assistance"
  - "admissions financial"
  - "re-enrollment agreement"
  - "nueva summer"
  - "summer institute"
  - "all faculty/staff work week"
  - "ifsel"
  - "creating institutional belonging"
  - "design thinking institute"
  - "structured word inquiry"

# ---------------------------------------------------------------------------
# DATE-BASED TRANSITION (senior milestone events)
# Events matching transition_keywords are:
#   BEFORE transition_date -> excluded (applies to another graduating class)
#   ON/AFTER transition_date -> included (applies to YOUR kid)
#
# June 15 is safely after current seniors' graduation (June 7) and last
# day of school (June 5). Works automatically for both Maia (2027) and
# Zander (2033) -- no changes needed when Zander becomes a senior.
# ---------------------------------------------------------------------------
transition_date: "2026-06-15"

transition_keywords:
  - "senior portraits"
  - "senior sunrise"
  - "senior retreat"
  - "senior spring retreat"
  - "senior send-off"
  - "senior parent send-off"
  - "senior banquet"
  - "senior dinner"
  - "12th grade graduation"
  - "lifers dinner"

# Optional per-feed extra exclusions.
# Example:
#   feed_excludes:
#     whole_school:
#       - "alumni reunion"
feed_excludes: {}
